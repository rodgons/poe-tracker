<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>POE Tracker</title>
<style>
  /* Corner panel: the whole tree spec, the next points numbered (variant D of the prototype). */
  :root {
    /* Path of Exile's palette: near-black panels, bronze frame, gold for taken points,
       Magic-item blue for what's next, red for refunds */
    --scene: #0b0a08; --scene2: #1a1712; --ink: #e0d6c3; --dim: #aa9e82; --faint: #4a4135;
    --alloc: #d9b45a; --next: #8888ff; --plan: #8a8072; --other: #2a251e; --refund: #e04a3f;
    --panel: rgba(11, 10, 8, .94); --edge: #6e5a3a;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: transparent; color: var(--ink); font-family: var(--body); }
  .panel {
    margin: 8px; padding: 12px 14px; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--edge); display: flex; flex-direction: column; gap: 10px;
  }
  .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hd h1 { margin: 0; font: 600 13px/1.2 var(--display); letter-spacing: .06em; color: var(--alloc); }
  .hd span { font: 500 11px var(--mono); color: var(--dim); white-space: nowrap; }
  .bar { height: 4px; background: var(--faint); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--alloc); }
  svg { display: block; width: 100%; height: auto; touch-action: none; }
  svg.zoomed { cursor: grab; }
  svg.dragging { cursor: grabbing; }
  .hd { cursor: move; user-select: none; -webkit-user-select: none; }
  .meta { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--dim); }
  .meta .refund { color: var(--refund); }
  .meta .warn { color: var(--refund); }
  .meta .keys { color: var(--faint); }
  /* the legend shows each mark as the tree draws it, so no state is told by colour alone */
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; }
  .legend > span, .meta .refund { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg.swatch { display: inline-block; width: 14px; height: 14px; flex: none; }
  .empty { font-size: 12.5px; line-height: 1.5; color: var(--dim); }
  .empty b { color: var(--alloc); }
</style>
</head>
<body>
<div class="panel" id="panel"><p class="empty">Loading…</p></div>
<script src="minitree.js"></script>
<script src="keys.js"></script>
<script>
  const { invoke } = window.__TAURI__.core
  const { listen } = window.__TAURI__.event
  const esc = MiniTree.esc
  let permission = ''
  let hotkey = KeyLabel.format({ code: 'KeyP', alt: true })
  let cam = MiniTree.camera(1)
  try { cam = MiniTree.camera(Number(localStorage.getItem('zoom'))) } catch {}
  const keepZoom = () => { try { localStorage.setItem('zoom', cam.zoom) } catch {} }

  function render(v) {
    const panel = document.getElementById('panel')
    const warn = permission.includes('NOT') ? `<span class="warn">⚠ ${esc(permission)}: the hotkey won't work. Allow POE Tracker in System Settings → Privacy &amp; Security → Input Monitoring.</span>` : ''
    if (!v) {
      panel.innerHTML = `<p class="empty"><b>No build yet.</b> Open <b>Set up build…</b> from the POE Tracker menu bar / tray icon.</p><div class="meta">${warn}</div>`
      return
    }
    const sw = MiniTree.swatch
    const pending = (v.pending || []).length > 0
    const refunds = v.refunds.length ? `<span class="refund">${sw('refund')}Refund: ${v.refunds.map(esc).join(', ')}</span>` : '<span>Refund: none</span>'
    const mark = (kind, text) => `<span>${sw(kind)}${text}</span>`
    const legend = v.next.length
      ? `<div class="legend">${mark('next', `next ${v.next.length}`)}${mark('taken', 'taken')}${v.refunds.length ? mark('refund', 'refund') : ''}${pending ? mark('pending', 'pending refund') : ''}${mark('later', 'later')}${cam.zoom > 1 ? `<span>×${cam.zoom.toFixed(1)}</span>` : ''}</div>`
      : `<span style="color:var(--alloc)">Spec complete${v.next_spec ? ` — next: ${esc(v.next_spec)}. Switch in Open build…` : ''}</span>`
    panel.innerHTML = `
      <div class="hd" title="Drag to move the panel"><h1>${esc(v.spec)}</h1><span>${v.done} / ${v.total}</span></div>
      <div class="bar"><i style="width:${v.total ? 100 * v.done / v.total : 0}%"></i></div>
      ${MiniTree.draw(v, 392, 0.72, cam)}
      <div class="meta">${legend}${refunds}${v.notices.map(n => `<span>${esc(n)}</span>`).join('')}${warn}<span class="keys">${hotkey} hide · scroll to zoom, drag to move · drag the title to move the panel</span></div>`
  }

  let view = null
  const panel = document.getElementById('panel')
  // the window follows the panel's height (plus its 8px margins)
  let fitted = 0
  new ResizeObserver(() => {
    const h = Math.ceil(panel.getBoundingClientRect().height) + 16
    if (h !== fitted) { fitted = h; invoke('fit_panel', { height: h }) }
  }).observe(panel)
  invoke('initial_status').then(s => { permission = s.permission; render(view) })
  listen('status', e => { permission = e.payload.permission })
  invoke('panel_view').then(v => { view = v; render(view) })
  listen('plan', e => { view = e.payload; render(view) })
  const useBinds = b => { hotkey = KeyLabel.format(b.toggle); render(view) }
  invoke('key_binds').then(useBinds)
  listen('binds', e => useBinds(e.payload))
  listen('zoom', e => { MiniTree.key(cam, e.payload); keepZoom(); render(view) })
  listen('pan', e => { MiniTree.pan(cam, e.payload); render(view) })
  MiniTree.attach(panel, cam, () => render(view), keepZoom)

  // dragging the title moves the panel within the game window; the app remembers the spot
  let moving = null
  panel.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !e.target.closest('.hd')) return
    moving = { x: e.screenX, y: e.screenY, dx: 0, dy: 0 }
    panel.setPointerCapture(e.pointerId)
    invoke('drag_panel', { phase: 'start', dx: 0, dy: 0 })
  })
  panel.addEventListener('pointermove', e => {
    if (!moving) return
    moving.dx = e.screenX - moving.x; moving.dy = e.screenY - moving.y
    invoke('drag_panel', { phase: 'move', dx: moving.dx, dy: moving.dy })
  })
  // a drag that ends without a pointerup (capture lost) still ends, where it last was,
  // or the app would think it's still dragging and stop placing the panel
  const endMove = e => {
    if (!moving) return
    if (e.type === 'pointerup') { moving.dx = e.screenX - moving.x; moving.dy = e.screenY - moving.y }
    invoke('drag_panel', { phase: 'end', dx: moving.dx, dy: moving.dy })
    moving = null
  }
  panel.addEventListener('pointerup', endMove)
  panel.addEventListener('pointercancel', endMove)
  panel.addEventListener('lostpointercapture', endMove)
</script>
</body>
</html>
