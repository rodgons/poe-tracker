<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>POE Tracker</title>
<style>
  /* Corner panel: the whole tree spec, the next points numbered (variant D of the prototype). */
  :root {
    --scene: #14110e; --scene2: #231d17; --ink: #ece3d2; --dim: #a39581; --faint: #4c4238;
    --alloc: #e3c46a; --next: #5fd3c4; --plan: #8a7a63; --other: #352d25; --refund: #e0806f;
    --panel: rgba(18, 15, 12, .92); --edge: #6b5a3e;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: transparent; color: var(--ink); font-family: var(--body); }
  .panel {
    margin: 8px; padding: 12px 14px; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--edge); display: flex; flex-direction: column; gap: 10px;
  }
  .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hd h1 { margin: 0; font: 600 13px/1.2 var(--display); letter-spacing: .06em; color: var(--alloc); }
  .hd span { font: 500 11px var(--mono); color: var(--dim); white-space: nowrap; }
  .bar { height: 4px; background: var(--faint); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--alloc); }
  svg { display: block; width: 100%; height: auto; touch-action: none; }
  svg.zoomed { cursor: grab; }
  svg.dragging { cursor: grabbing; }
  .meta { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--dim); }
  .meta .refund { color: var(--refund); }
  .meta .warn { color: var(--refund); }
  .meta .keys { color: var(--faint); }
  .empty { font-size: 12.5px; line-height: 1.5; color: var(--dim); }
  .empty b { color: var(--alloc); }
</style>
</head>
<body>
<div class="panel" id="panel"><p class="empty">Loading…</p></div>
<script>
  const { invoke } = window.__TAURI__.core
  const { listen } = window.__TAURI__.event
  const R = { small: 46, notable: 78, keystone: 110, mastery: 64, jewel: 70, start: 120 }
  const col = { alloc: 'var(--alloc)', refund: 'var(--refund)', next: 'var(--next)', plan: 'var(--plan)', other: 'var(--other)' }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  let permission = ''
  // zoom over the whole-spec view (1 = whole spec), centred on the next points
  const MAX_ZOOM = 6
  const clampZoom = z => Math.min(MAX_ZOOM, Math.max(1, z))
  let zoom = 1
  // where the zoomed view is centred; null follows the Next points
  let center = null
  try { zoom = clampZoom(Number(localStorage.getItem('zoom')) || 1) } catch {}
  const keepZoom = () => { try { localStorage.setItem('zoom', zoom) } catch {} }

  let frame = null
  function tree(v, width) {
    const by = Object.fromEntries(v.nodes.map(n => [n.id, n]))
    const mine = v.nodes.filter(n => n.s !== 'other'), pad = 160
    let x0 = Math.min(...mine.map(n => n.x)) - pad, y0 = Math.min(...mine.map(n => n.y)) - pad
    let w = Math.max(...mine.map(n => n.x)) - x0 + pad, h = Math.max(...mine.map(n => n.y)) - y0 + pad
    // a steady 0.72 aspect, so the panel keeps its size between specs
    const ratio = 0.72
    if (h < w * ratio) { y0 -= (w * ratio - h) / 2; h = w * ratio } else { x0 -= (h / ratio - w) / 2; w = h / ratio }
    if (zoom > 1) {
      const focus = v.nodes.filter(n => n.s === 'next').length ? v.nodes.filter(n => n.s === 'next') : mine
      const [cx, cy] = center ?? [focus.reduce((a, n) => a + n.x, 0) / focus.length, focus.reduce((a, n) => a + n.y, 0) / focus.length]
      const zw = w / zoom, zh = h / zoom
      // stay inside the whole-spec frame
      x0 = Math.min(Math.max(cx - zw / 2, x0), x0 + w - zw); y0 = Math.min(Math.max(cy - zh / 2, y0), y0 + h - zh)
      w = zw; h = zh
      if (center) center = [x0 + w / 2, y0 + h / 2]
    }
    frame = { x0, y0, cx: x0 + w / 2, cy: y0 + h / 2, w, h }
    const u = w / width
    let g = ''
    for (const [a, b] of v.edges) {
      const A = by[a], B = by[b]
      const taken = n => n.s === 'alloc' || n.s === 'refund'
      const s = taken(A) && taken(B) ? (A.s === 'refund' || B.s === 'refund' ? 'refund' : 'alloc')
        : A.s !== 'other' && B.s !== 'other' && (A.s === 'next' || B.s === 'next') ? 'next'
        : A.s !== 'other' && B.s !== 'other' ? 'plan' : 'other'
      const dash = s === 'plan' ? `stroke-dasharray="${4 * u} ${3 * u}"` : ''
      g += `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${col[s]}" stroke-width="${(s === 'other' ? 1 : s === 'plan' ? 1.4 : 2.4) * u}" ${dash}/>`
    }
    for (const n of v.nodes) {
      const r = R[n.k] * (n.s === 'other' ? .7 : 1)
      const fill = n.s === 'alloc' ? 'var(--alloc)' : n.s === 'refund' ? 'var(--refund)' : n.s === 'next' ? 'var(--scene)' : 'var(--scene2)'
      const attrs = `fill="${fill}" stroke="${col[n.s]}" stroke-width="${(n.s === 'next' ? 2.4 : 1.4) * u}"`
      g += n.k === 'mastery'
        ? `<rect x="${n.x - r}" y="${n.y - r}" width="${2 * r}" height="${2 * r}" transform="rotate(45 ${n.x} ${n.y})" ${attrs}/>`
        : `<circle cx="${n.x}" cy="${n.y}" r="${r}" ${attrs}/>`
      if (n.i) g += `<circle cx="${n.x}" cy="${n.y}" r="${9.5 * u}" fill="var(--next)"/><text x="${n.x}" y="${n.y + 3.8 * u}" font-size="${11 * u}" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="500" fill="var(--scene)">${n.i}</text>`
      const named = n.s === 'next' || n.s === 'refund' || (n.k !== 'small' && n.k !== 'start' && n.k !== 'mastery' && n.s !== 'other')
      if (named) g += `<text x="${n.x}" y="${n.y - r - 5 * u}" font-size="${10 * u}" text-anchor="middle" fill="${n.s === 'next' ? 'var(--next)' : n.s === 'refund' ? 'var(--refund)' : n.s === 'alloc' ? 'var(--alloc)' : 'var(--dim)'}" font-weight="${n.s === 'next' ? 600 : 400}">${esc(n.n.split(' → ')[0])}</text>`
    }
    return `<svg id="tree" class="${zoom > 1 ? 'zoomed' : ''}${drag ? ' dragging' : ''}" viewBox="${x0} ${y0} ${w} ${h}" role="img" aria-label="Mini passive tree">${g}</svg>`
  }

  function render(v) {
    const panel = document.getElementById('panel')
    const warn = permission.includes('NOT') ? `<span class="warn">⚠ ${esc(permission)}: the hotkey won't work. Allow POE Tracker in System Settings → Privacy &amp; Security → Input Monitoring.</span>` : ''
    if (!v) {
      panel.innerHTML = `<p class="empty"><b>No build yet.</b> Open <b>Set up build…</b> from the POE Tracker menu bar / tray icon.</p><div class="meta">${warn}</div>`
      return
    }
    const refunds = v.refunds.length ? `<span class="refund">Refund: ${v.refunds.map(esc).join(', ')}</span>` : '<span>Refund: none</span>'
    const legend = v.next.length
      ? `<span><span style="color:var(--next)">●</span> next ${v.next.length} numbered · gold = taken${v.refunds.length ? ' · <span style="color:var(--refund)">red = refund</span>' : ''} · dashed = later${zoom > 1 ? ` · ×${zoom.toFixed(1)}` : ''}</span>`
      : '<span style="color:var(--alloc)">Spec complete</span>'
    panel.innerHTML = `
      <div class="hd"><h1>${esc(v.spec)}</h1><span>${v.done} / ${v.total}</span></div>
      <div class="bar"><i style="width:${v.total ? 100 * v.done / v.total : 0}%"></i></div>
      ${tree(v, 392)}
      <div class="meta">${legend}${refunds}${v.notices.map(n => `<span>${esc(n)}</span>`).join('')}${warn}<span class="keys">⌥P hide · scroll to zoom, drag to move · ⌥0 whole spec</span></div>`
  }

  let view = null
  // the window follows the panel's height (plus its 8px margins)
  let fitted = 0
  new ResizeObserver(() => {
    const h = Math.ceil(document.getElementById('panel').getBoundingClientRect().height) + 16
    if (h !== fitted) { fitted = h; invoke('fit_panel', { height: h }) }
  }).observe(document.getElementById('panel'))
  invoke('initial_status').then(s => { permission = s.permission; render(view) })
  listen('status', e => { permission = e.payload.permission })
  invoke('panel_view').then(v => { view = v; render(view) })
  listen('plan', e => { view = e.payload; render(view) })
  listen('zoom', e => {
    zoom = e.payload === 0 ? 1 : clampZoom(zoom * (e.payload > 0 ? 1.5 : 1 / 1.5))
    if (zoom === 1) center = null
    keepZoom()
    render(view)
  })
  listen('pan', e => {
    if (zoom === 1 || !frame) return
    const [dx, dy] = e.payload
    // a third of the view per press
    center = [frame.cx + dx * frame.w / 3, frame.cy + dy * frame.h / 3]
    render(view)
  })

  // the mouse: scroll zooms around the pointer, dragging moves the zoomed view
  let queued = false
  const redraw = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(view) }) } }
  const panel = document.getElementById('panel')
  // the point of the tree under the pointer, and where the pointer sits in the view (0–1)
  function under(e) {
    const box = document.getElementById('tree').getBoundingClientRect()
    const fx = (e.clientX - box.left) / box.width, fy = (e.clientY - box.top) / box.height
    return { fx, fy, x: frame.x0 + fx * frame.w, y: frame.y0 + fy * frame.h, box }
  }
  panel.addEventListener('wheel', e => {
    if (!view || !frame || !e.target.closest('#tree')) return
    e.preventDefault()
    const p = under(e)
    const before = zoom
    zoom = clampZoom(zoom * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.002)))
    if (zoom === before) return
    if (zoom === 1) {
      center = null
    } else {
      // keep the point under the pointer still
      const w = frame.w * before / zoom, h = frame.h * before / zoom
      center = [p.x - p.fx * w + w / 2, p.y - p.fy * h + h / 2]
    }
    keepZoom()
    redraw()
  }, { passive: false })
  let drag = null
  panel.addEventListener('pointerdown', e => {
    if (zoom === 1 || !frame || !e.target.closest('#tree')) return
    drag = { x: e.clientX, y: e.clientY, cx: frame.cx, cy: frame.cy, scale: frame.w / under(e).box.width }
    panel.setPointerCapture(e.pointerId)
    redraw()
  })
  panel.addEventListener('pointermove', e => {
    if (!drag) return
    center = [drag.cx - (e.clientX - drag.x) * drag.scale, drag.cy - (e.clientY - drag.y) * drag.scale]
    redraw()
  })
  const endDrag = () => { if (drag) { drag = null; redraw() } }
  panel.addEventListener('pointerup', endDrag)
  panel.addEventListener('pointercancel', endDrag)
</script>
</body>
</html>
