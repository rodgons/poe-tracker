<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>POE Tracker</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Main window: the one app window away from the game, in sections (Tree, Gems, Items, Guide, Build, Settings).
     Tokens and type come from theme.css. Hierarchy: Cinzel gold for what a page is, ink for what to read,
     muted tones for what's done or secondary, and the state hues only where something needs doing. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--scene); color: var(--ink); font: 15px/1.5 var(--body); }
  body { display: grid; grid-template-columns: 196px 1fr; }

  /* sidebar: the sections, then the app's version and any update waiting */
  nav { display: flex; flex-direction: column; gap: 2px; padding: 18px 10px 12px; background: var(--card); border-right: 1px solid var(--edge); }
  nav .brand { margin: 0 10px 16px; font: 700 16px var(--display); letter-spacing: .06em; color: var(--alloc); }
  nav button.go {
    display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 10px;
    background: none; border: 1px solid transparent; border-radius: 6px; color: var(--dim); font: 500 15px var(--body); text-align: left; cursor: pointer;
  }
  nav button.go:hover { background: var(--scene2); color: var(--ink); }
  nav button.go[aria-current="page"] { background: var(--alloc-bg); border-color: rgba(217, 180, 90, .35); color: var(--alloc); font-weight: 600; }
  nav button.go:focus-visible { outline: 2px solid var(--alloc); outline-offset: -2px; }
  /* a Build draft not saved yet */
  nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--next); }
  nav .dot[hidden] { display: none; }
  nav footer { margin-top: auto; padding: 0 4px; display: flex; flex-direction: column; gap: 8px; font: 500 12px var(--body); color: var(--plan); }
  nav footer button { font-size: 13px; padding: 7px 10px; }
  /* Re-sync: reachable from every section once a Build is saved */
  nav .sync { display: flex; flex-direction: column; gap: 4px; margin: 0 0 6px; }
  nav .sync[hidden] { display: none; }
  nav .sync span { font: 400 12px var(--body); color: var(--dim); min-height: 1.4em; }
  nav .sync span.bad { color: var(--refund); }
  /* a newer version: offered in the sidebar on every section */
  nav .upd { display: flex; flex-direction: column; gap: 5px; padding: 9px 10px; border-radius: 8px;
    background: rgba(111, 224, 79, .08); border: 1px solid rgba(111, 224, 79, .45); }
  nav .upd[hidden] { display: none; }
  nav .upd small { font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: #6fe04f; }
  nav .upd span { font: 400 13px/1.35 var(--body); color: var(--ink); }
  nav .upd .upd-err { color: var(--refund); font-size: 12px; }
  nav .upd .upd-err:empty { display: none; }
  /* What's new: once after each update */
  dialog#whatsNew { max-width: 520px; width: calc(100% - 32px); max-height: 80vh; padding: 0; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); color: var(--ink); box-shadow: 0 16px 48px rgba(0, 0, 0, .6); }
  dialog#whatsNew::backdrop { background: rgba(0, 0, 0, .65); }
  .wn-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 8px; }
  .wn-hd h2 { margin: 0; font: 700 19px var(--display); letter-spacing: .04em; color: var(--alloc); }
  .wn-x { background: none; color: var(--dim); font-size: 22px; line-height: 1; padding: 2px 8px; }
  .wn-x:hover { color: var(--ink); }
  .wn-body { padding: 0 20px 4px; overflow-y: auto; max-height: calc(80vh - 130px); }
  .wn-body h3 { margin: 14px 0 4px; font: 600 13px var(--body); color: var(--dim); }
  .wn-body ul { margin: 0; padding-left: 18px; }
  .wn-body li { display: list-item; list-style: disc; cursor: default; padding: 0; margin: 5px 0; line-height: 1.45; font-size: 14.5px; }
  .wn-body li::marker { color: var(--alloc); }
  .wn-ft { display: flex; justify-content: flex-end; padding: 14px 20px 18px; }

  /* the loadout being followed, on every section */
  nav .cur-lo { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left;
    background: var(--alloc-bg); color: var(--ink); border: 1px solid rgba(217, 180, 90, .4); padding: 8px 10px; }
  nav .cur-lo[hidden] { display: none; }
  nav .cur-lo small { font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  nav .cur-lo b { font: 700 14px var(--body); color: var(--alloc); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .cur-lo span { font: 400 12.5px var(--body); color: var(--dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the Build section's loadout list */
  .lo-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .lo-top h1 { margin: 0 !important; flex: 1; }
  .lo-row { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 6px 10px 6px 4px; margin-bottom: 8px; }
  .lo-row.active { border-color: rgba(217, 180, 90, .6); background: var(--alloc-bg); }
  .lo-use { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; background: none; color: var(--ink); text-align: left; padding: 6px 10px; }
  .lo-use:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .lo-use b { font: 600 15.5px var(--body); color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lo-row.active .lo-use b { color: var(--alloc); }
  .lo-use span { font: 400 13px var(--body); color: var(--dim); }
  .lo-row .tag { display: inline-flex; align-items: center; gap: 4px; font: 700 11.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--alloc); padding: 0 8px; }
  .lo-row button.ghost { padding: 6px 12px; font-size: 13px; }

  #content { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; }
  /* problems that touch the whole app, each with a way to fix it */
  #banners:empty { display: none; }
  #banners { display: flex; flex-direction: column; gap: 6px; padding: 10px 16px 0; }
  .banner { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 8px; font-size: 14px;
    color: var(--ink); background: var(--refund-bg); border: 1px solid rgba(232, 87, 75, .55); }
  .banner svg { flex: none; width: 16px; height: 16px; }
  .banner span { flex: 1; }
  .banner button { flex: none; padding: 6px 12px; font-size: 13px; }
  section.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  section.view[hidden] { display: none; }

  /* each section's bar: who, what's picked, how far along */
  .treebar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; min-height: 56px; background: var(--card); border-bottom: 1px solid var(--edge); }
  .treebar .who { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .treebar .who.how { color: var(--dim); font-weight: 400; font-size: 13px; }
  .progress { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 120px; }
  .bar { flex: 1; height: 6px; background: var(--faint); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--alloc); }
  .progress span { font: 600 13.5px var(--body); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .treebody { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  svg.zoomed { cursor: grab; }
  svg.dragging { cursor: grabbing; }
  #hint { position: absolute; right: 12px; bottom: 10px; color: var(--plan); font-size: 12.5px; pointer-events: none; }
  /* the Ascendancy inset: bottom-left over the tree, never zoomed or dragged with it */
  #stage .asc { position: absolute; left: 12px; bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
  #stage .asc svg { position: static; display: block; width: 100%; height: auto; }
  .asc-hd { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px 0; font: 700 14px/1.2 var(--display); letter-spacing: .04em; color: var(--alloc); }
  .asc-hd b { font: 600 13px var(--body); font-variant-numeric: tabular-nums; color: var(--dim); }
  aside { width: 330px; border-left: 1px solid var(--edge); background: var(--card); overflow-y: auto; padding: 14px 14px 20px; }
  aside h2 { font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 18px 4px 6px; }
  aside h2:first-child { margin-top: 0; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; align-items: center; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  li:hover { background: var(--scene2); }
  li b { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px;
    font: 600 12px var(--body); font-variant-numeric: tabular-nums; }
  /* taken: steps back behind a gold check; next: the tree's own numbered blue badge; later: plain number */
  li.taken { color: var(--plan); }
  li.taken b { color: var(--alloc); font-size: 14px; }
  li.next { color: var(--next); font-weight: 700; background: var(--next-bg); }
  li.next + li.next { margin-top: 2px; }
  li.next b { width: 20px; min-width: 20px; border-radius: 50%; background: var(--next); color: var(--scene); font-weight: 700; margin: 0 1px; }
  li.later { color: var(--dim); }
  li.later b { color: var(--plan); font-weight: 500; }
  .refund { color: var(--refund); }
  li.refund b { font-size: 14px; }
  .note { color: var(--dim); font-size: 14px; margin: 4px 4px 8px; }
  .note.pending { display: flex; gap: 6px; align-items: flex-start; }
  .note.pending svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .empty { margin: auto; max-width: 440px; padding: 24px; color: var(--dim); font-size: 15px; text-align: center; }
  .empty b { color: var(--alloc); }
  .empty button { margin-top: 14px; }
  #tip {
    position: fixed; pointer-events: none; max-width: 320px; padding: 9px 12px; border-radius: 8px;
    background: rgba(11, 10, 8, .97); border: 1px solid #6e5a3a; font-size: 13.5px; display: none; z-index: 2; box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
  }
  #tip strong { display: block; color: var(--alloc); margin-bottom: 4px; font-size: 14.5px; }

  /* Gems: the Skill set beside the Character's gems. Every mark has a drawn icon and a word,
     never colour alone: check had, plus missing, broken link unlinked, minus remove, ring optional.
     The ones to act on (missing, unlinked, remove) are filled chips; had and optional stay quiet. */
  .gemsbody { flex: 1; overflow-y: auto; padding: 18px 20px 32px; }
  .gemsbody > div { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .gemsbar .asof { font: 500 13px var(--body); font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }
  .gemsbar .asof.old { color: var(--refund); font-weight: 600; }
  .tally { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--dim); }
  .tally b { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; margin: 0 8px 0 -2px; color: var(--ink); }
  .gnote { margin: 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: var(--card); border: 1px solid var(--edge); color: var(--dim); }
  .gnote.ok { color: var(--alloc); border-color: rgba(217, 180, 90, .5); background: var(--alloc-bg); }
  .ghead { margin: 14px 2px 0; font: 700 15px var(--display); letter-spacing: .04em; color: var(--alloc); }
  .gcard { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px 8px; }
  .gcard h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 2px; font: 700 15.5px var(--body); color: var(--ink); }
  .gcard h3 small { font-weight: 400; font-size: 13px; color: var(--dim); }
  .gcard.remove { border-color: rgba(232, 87, 75, .5); }
  .grow { display: grid; grid-template-columns: 112px 1fr auto auto; gap: 12px; align-items: center; padding: 4px 0; border-top: 1px solid var(--other); font-size: 15px; }
  .grow:first-of-type { border-top: 0; }
  .grow > span:first-child { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .grow > span:first-child .hint { font-size: 12px; padding-left: 4px; }
  .grow .gname small { color: var(--dim); }
  .grow .gname { display: flex; align-items: center; gap: 10px; min-width: 0; }
  /* the gem's own picture: the socketed gem's from the items import, else from the bundled table */
  .gicon { flex: none; width: 30px; height: 30px; object-fit: contain; }
  .gicon.none { visibility: hidden; }
  /* click a gem's name to copy it, say for a vendor's or the stash's search */
  .gcopy { cursor: copy; border-radius: 3px; }
  .gcopy:hover { color: var(--alloc); text-decoration: underline dotted; text-underline-offset: 3px; }
  .gcopy:focus-visible { outline: 2px solid var(--alloc); outline-offset: 1px; }
  .copied { margin-left: 6px; font: 600 12px var(--body); color: var(--alloc); }
  .grow.optional .gicon, .grow.missing .gicon { opacity: .6; }
  .grow .lv { font: 500 13px var(--body); font-variant-numeric: tabular-nums; color: var(--dim); text-align: right; min-width: 64px; }
  .grow .lv.head { font: 700 11.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--plan); }
  .mark { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 6px; border-radius: 999px; border: 1px solid transparent;
    font: 700 13px/1.5 var(--body); white-space: nowrap; }
  .mark .ic { width: 14px; height: 14px; stroke-width: 2; }
  .mark.had { color: var(--alloc); padding-left: 4px; }
  .mark.missing { color: var(--next); background: var(--next-bg); border-color: rgba(136, 136, 255, .5); }
  .mark.unlinked { color: var(--unlinked); background: var(--unlinked-bg); border-color: rgba(224, 154, 79, .5); }
  .mark.remove { color: var(--refund); background: var(--refund-bg); border-color: rgba(232, 87, 75, .5); }
  .mark.optional { color: var(--plan); font-weight: 600; padding-left: 4px; }
  .grow.optional .gname { color: var(--dim); }
  .grow.support .gname { padding-left: 14px; }

  /* Guide: the whole Leveling guide by act; done steps step back behind a check, the current one
     outlined and tinted, any step clickable to make it current */
  .guidebar .opt { margin: 0; white-space: nowrap; color: var(--dim); }
  .guidebar select { width: auto; padding: 6px 8px; font-size: 13.5px; }
  .guidebody { flex: 1; overflow-y: auto; padding: 0 20px 32px; }
  .guidebody > div { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }
  .guidebody h2 { position: sticky; top: 0; z-index: 1; margin: 0; padding: 18px 6px 8px; background: var(--scene);
    font: 700 17px var(--display); letter-spacing: .05em; color: var(--alloc); border-bottom: 1px solid var(--edge); margin-bottom: 4px; }
  .gstep { display: grid; grid-template-columns: 34px 1fr; gap: 0 10px; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px;
    cursor: pointer; text-align: left; background: none; color: var(--ink); font: 15px/1.5 var(--body); width: 100%; }
  .gstep:hover { border-color: var(--edge); background: var(--card); }
  .gstep:focus-visible { outline: 2px solid var(--alloc); outline-offset: 1px; }
  .gstep .n { display: flex; justify-content: flex-end; font: 600 13px/1.6 var(--body); font-variant-numeric: tabular-nums; color: var(--plan); }
  .gstep .n .ic { margin-top: .2em; }
  .gstep.done { color: var(--plan); }
  .gstep.done .n { color: var(--alloc); }
  .gstep.done .g-gem { opacity: .7; }
  .gstep.cur { border-color: var(--next); background: var(--next-bg); box-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
  .gstep.cur .n { color: var(--next); font-weight: 700; font-size: 15px; }
  .gstep .ln + .ln { margin-top: 2px; }
  .gstep .sub { padding-left: 18px; font-size: 14px; color: var(--dim); }
  .gstep.done .g-kill, .gstep.done .g-enter, .gstep.done .g-quest { color: inherit; }
  .gdone { margin: 14px 4px; padding: 10px 12px; border-radius: 8px; background: var(--alloc-bg); border: 1px solid rgba(217, 180, 90, .5); color: var(--alloc); font-weight: 600; }
  .credit { margin: 22px 6px 0; font-size: 13.5px; color: var(--plan); max-width: 75ch; }

  /* Items: the Item set as checklist rows, one per slot (or jewel), the first mods inline and a
     Trade button; a click opens all its mods. Rarity colours follow the game's own item text. */
  .itemsbody { flex: 1; overflow-y: auto; padding: 18px 20px 32px; }
  .itemsbody > div { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .igroup { border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; background: var(--card); }
  .igroup > h2 { margin: 0; padding: 9px 14px; background: var(--scene2); font: 700 15px var(--display); letter-spacing: .04em; color: var(--alloc); }
  .irow { border-top: 1px solid var(--edge); }
  .irow summary { list-style: none; display: grid; grid-template-columns: 116px minmax(0, 240px) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 9px 14px; cursor: pointer; }
  .irow summary::-webkit-details-marker { display: none; }
  .irow summary:hover, .irow[open] summary { background: var(--scene2); }
  .irow summary:focus-visible { outline: 2px solid var(--alloc); outline-offset: -2px; }
  .irow .sn { color: var(--dim); font-size: 13px; }
  .irow .it { min-width: 0; }
  .irow .it b { display: block; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .irow .it span { color: var(--dim); font-size: 13px; }
  .irow .gist { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--imod); font-size: 14px; }
  .irow .gist i { font-style: normal; color: var(--plan); }
  .irow .full { padding: 6px 14px 14px 144px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 24px; }
  .irow .full h4 { margin: 0 0 3px; font: 700 11.5px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .imods { list-style: none; margin: 0; padding: 0; }
  .imods li { color: var(--imod); padding: 1px 0; cursor: default; }
  .imods li:hover { background: none; }
  .imods li.k-crafted, .imods li.k-enchant { color: var(--icraft); }
  .imods li.k-fractured { color: var(--ifrac); }
  .imods li small { color: var(--plan); font-size: 12px; }
  .imods li.off { color: var(--dim); }
  .iflag { color: var(--refund); font-size: 13px; }
  .iflag.infl { color: var(--dim); }
  /* the guide author's advice, kept apart from the mods: plain prose, not item text */
  .inotes { margin: 0; padding: 8px 12px; border: 1px solid var(--edge); background: var(--scene); border-radius: 8px; }
  .inotes p { margin: 0; color: var(--ink); font-size: 13.5px; line-height: 1.45; }
  .inotes p + p { margin-top: 4px; }
  .hasnotes { margin-left: 8px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 11.5px; color: var(--dim); font-weight: 600; vertical-align: 2px; }
  .r-normal { color: var(--inormal); } .r-magic { color: var(--next); } .r-rare { color: var(--irare); } .r-unique { color: var(--iunique); }
  .copies { margin-left: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; font: 600 12px var(--body); font-variant-numeric: tabular-nums; color: var(--alloc); }
  .trade { padding: 5px 12px; font-size: 13px; white-space: nowrap; }
  .trades { display: flex; gap: 6px; justify-content: flex-end; }
  /* the second choice: same search, any base of the item's kind */
  .trade.any { border-color: var(--line); color: var(--dim); }
  .trade.any:hover { color: var(--alloc); border-color: var(--alloc); }
  .iempty { padding: 10px 14px; border-top: 1px solid var(--edge); color: var(--dim); }
  .inote { margin: 0; color: var(--dim); font-size: 13px; max-width: 80ch; }
  @media (max-width: 720px) {
    .irow summary { grid-template-columns: minmax(0, 1fr) auto; }
    .irow .sn, .irow .gist { display: none; }
    .irow .full { padding-left: 14px; }
  }

  /* Build and Settings: forms in a readable column */
  .form { flex: 1; overflow-y: auto; padding: 26px 24px 36px; }
  .form > div { max-width: 600px; margin: 0 auto; }
  .form h1 { margin: 0 0 18px; font: 700 21px var(--display); letter-spacing: .04em; color: var(--alloc); }
  fieldset { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 16px; margin: 0 0 14px; min-width: 0; }
  fieldset.off { opacity: .45; pointer-events: none; }
  label { display: block; font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }
  label small { font-weight: 400; font-size: 13px; color: var(--dim); }
  .gap { margin-top: 16px; }
  textarea, input, select {
    width: 100%; background: var(--scene); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: 15px var(--body);
  }
  input::placeholder, textarea::placeholder { color: var(--plan); }
  input:hover, textarea:hover, select:hover { border-color: #8a785b; }
  .treebar select { width: auto; max-width: 360px; padding: 6px 10px; font-size: 14px; }
  textarea { height: 68px; resize: vertical; font-family: var(--mono); font-size: 12.5px; caret-color: var(--alloc); }
  input { caret-color: var(--alloc); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--alloc); outline-offset: -1px; border-color: transparent; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row input[type=number] { width: 90px; }
  .row input:not([type=number]) { flex: 1; }
  .opt { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 10px 0 0; cursor: pointer; }
  .opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--alloc); }
  .indent { margin-left: 24px; }
  .hint { color: var(--dim); font-size: 14px; margin: 6px 0 0; }
  .hint b { color: var(--next); font-weight: 700; }
  button {
    background: var(--alloc); color: var(--scene); border: 0; border-radius: 6px; padding: 8px 16px;
    font: 700 14px var(--body); cursor: pointer;
  }
  /* the primary buttons carry no class: New loadout, Save, Got it, Update now, Go to Build */
  button:not([class]):hover:not(:disabled) { background: #e6c46e; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--alloc); border: 1px solid rgba(217, 180, 90, .7); }
  button.ghost:hover { background: var(--alloc-bg); border-color: var(--alloc); }
  .path { flex: 1; word-break: break-all; font-family: var(--mono); font-size: 12.5px; margin: 0; color: var(--ink); }
  .path.missing { color: var(--refund); font-family: var(--body); font-size: 13.5px; }
  .err { color: var(--refund); min-height: 1.5em; margin: 4px 0 0; font-weight: 600; }
  .binds { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; margin-top: 10px; }
  .binds button { min-width: 140px; font: 600 13.5px var(--body); padding: 6px 10px; }
  .binds button.rec { background: var(--next); color: var(--scene); border-color: var(--next); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .actions .err { flex: 1; margin: 0; }
  .saved { color: var(--ok); font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<nav>
  <p class="brand">POE Tracker</p>
  <button class="go" data-go="tree">Tree</button>
  <button class="go" data-go="gems">Gems</button>
  <button class="go" data-go="items">Items</button>
  <button class="go" data-go="guide">Guide</button>
  <button class="go" data-go="build">Build <i class="dot" id="draftDot" hidden title="Not saved"></i></button>
  <button class="go" data-go="settings">Settings</button>
  <footer>
    <button class="cur-lo" id="curLoadout" hidden title="The loadout you're following · click to change"><small>Following</small><b id="curName"></b><span id="curWho"></span></button>
    <div class="sync" id="sync" hidden>
      <button class="ghost" id="resync" title="Import the Character's taken points from pathofexile.com again">Re-sync character</button>
      <span id="synced" role="status"></span>
    </div>
    <div class="upd" id="updBox" hidden>
      <small id="updHead">New version</small>
      <span id="updText"></span>
      <button id="update"></button>
      <span class="upd-err" id="updErr"></span>
    </div>
    <span id="version"></span></footer>
</nav>

<div id="content">
  <div id="banners"></div>

  <section class="view" id="tree" hidden><p class="empty">Loading…</p></section>

  <section class="view" id="gems" hidden><p class="empty">Loading…</p></section>

  <section class="view" id="items" hidden><p class="empty">Loading…</p></section>

  <section class="view" id="guide" hidden><p class="empty">Loading…</p></section>

  <section class="view" id="build" hidden>
    <div class="form" id="loList"><div>
      <div class="lo-top"><h1>Loadouts</h1><button id="loNew">New loadout</button></div>
      <p class="hint" style="margin:-8px 0 14px">Each loadout pairs a Character with a Path of Building build. Click one to follow it.</p>
      <div id="loRows"></div>
      <p class="err" id="loErr"></p>
    </div></div>
    <div class="form" id="loEdit" hidden><div>
      <div class="lo-top"><button class="ghost" id="loBack">‹ Loadouts</button><h1 id="loTitle" style="flex:1">New loadout</h1></div>
      <fieldset>
        <label for="loName">Name <small>(how this loadout shows in the list and the sidebar)</small></label>
        <input id="loName" spellcheck="false" autocomplete="off" placeholder="e.g. RF Juggernaut">
      </fieldset>
      <fieldset>
        <label for="input">Path of Building build <small>(export code, pobb.in or pastebin link)</small></label>
        <textarea id="input" spellcheck="false" placeholder="https://pobb.in/… or eNrtvW…"></textarea>
        <div class="row"><button class="ghost" id="load">Load build</button><span class="hint" id="loaded" style="margin:0"></span></div>
        <p class="err" id="loadErr"></p>
      </fieldset>
      <fieldset id="pick" class="off">
        <label for="spec">Tree spec</label>
        <select id="spec"></select>
        <label for="account" class="gap">pathofexile.com account <small>(Name#1234, to import your taken points)</small></label>
        <div class="row"><input id="account" spellcheck="false" autocomplete="off" placeholder="Name#1234"><button class="ghost" id="find">Find characters</button></div>
        <div class="row"><p class="hint" id="found" style="flex:1;margin:0"></p><label class="opt" style="margin:0"><input type="checkbox" id="currentOnly" checked> Current league only</label></div>
        <label for="character" class="gap">Character name <small>(the character this build is for)</small></label>
        <div class="row" style="margin-top:0">
          <input id="character" spellcheck="false" autocomplete="off">
          <select id="charPick" hidden style="flex:1"></select>
        </div>
        <label class="gap">Points already taken</label>
        <label class="opt" id="keepOpt" hidden><input type="radio" name="seed" value="keep"> Keep the points the app already tracks for this character</label>
        <label class="opt"><input type="radio" name="seed" value="import"> Import from pathofexile.com <small class="hint" style="margin:0">(your Characters tab must be public)</small></label>
        <label class="opt"><input type="radio" name="seed" value="hand"> Set by hand</label>
        <div class="row indent"><input type="number" id="taken" min="0" value="0"><span class="hint" id="takenHint" style="margin:0"></span></div>
        <div class="row indent" id="ascRow" hidden><input type="number" id="ascTaken" min="0" value="0" aria-label="Ascendancy points taken"><span class="hint" id="ascHint" style="margin:0"></span></div>
      </fieldset>
      <div class="actions"><p class="err" id="saveErr"></p><button class="ghost" id="loCancel">Cancel</button><button id="save" disabled>Save</button></div>
    </div></div>
  </section>

  <section class="view" id="settings" hidden>
    <div class="form"><div>
      <h1>Settings</h1>
      <fieldset>
        <label for="points">Next points <small>(how many the Corner panel numbers)</small></label>
        <div class="row"><input type="number" id="points" min="1" max="15" value="5"><span class="saved" id="pointsSaved"></span></div>
        <label class="gap">Game log <small>(Client.txt, read only, so points tick off as you take them)</small></label>
        <div class="row"><span class="hint path" id="logPath">Looking…</span><button class="ghost" id="chooseLog">Choose…</button></div>
        <p class="err" id="logErr"></p>
      </fieldset>
      <fieldset>
        <label>Key binds <small>(click one, then press the new keys)</small></label>
        <div class="binds" id="binds"></div>
        <p class="hint" id="bindHint"></p>
        <div class="row"><button class="ghost" id="resetBinds">Reset to defaults</button><p class="err" id="bindErr" style="flex:1;margin:0"></p></div>
      </fieldset>
    </div></div>
  </section>
</div>
<div id="tip"></div>
<dialog id="whatsNew" aria-labelledby="wnTitle">
  <div class="wn-hd"><h2 id="wnTitle">What's new</h2><button class="wn-x" id="wnX" aria-label="Close">×</button></div>
  <div class="wn-body" id="wnBody"></div>
  <div class="wn-ft"><button id="wnOk">Got it</button></div>
</dialog>

<script src="minitree.js"></script>
<script src="keys.js"></script>
<script src="gem-icons.js"></script>
<script src="icons.js"></script>
<script src="guide-parts.js"></script>
<script>
  const { invoke } = window.__TAURI__.core
  const { listen } = window.__TAURI__.event
  const esc = MiniTree.esc
  const $ = id => document.getElementById(id)
  const remember = (k, v) => { try { localStorage.setItem(k, v) } catch {} }
  const recall = k => { try { return localStorage.getItem(k) } catch { return null } }

  let data = null        // the Tree section's view (build_view), null with no build
  let permission = ''
  let binds = null

  // ---- sections ----
  const names = { tree: 'Tree', gems: 'Gems', items: 'Items', guide: 'Guide', build: 'Build', settings: 'Settings' }
  let current = null
  function show(name) {
    if (!names[name]) return
    current = name
    for (const id of Object.keys(names)) $(id).hidden = id !== name
    document.querySelectorAll('nav button.go').forEach(b => b.dataset.go === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'))
    document.title = `POE Tracker · ${names[name]}`
    remember('section', name)
    if (name === 'tree') drawTree()
    if (name === 'gems') { loadGems(); invoke('refresh_gems') }
    if (name === 'items') { loadItems(); invoke('refresh_items') }
    if (name === 'guide') loadGuide(true)
  }
  document.querySelectorAll('nav button.go').forEach(b => b.onclick = () => show(b.dataset.go))
  // the tray's Settings… opens that section; without one, Build until a build is saved, then the last used
  listen('section', e => show(e.payload))

  // ---- banners ----
  const icon = {
    pause: '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.5" height="8" rx=".5" fill="var(--refund)"/><rect x="7" y="2" width="2.5" height="8" rx=".5" fill="var(--refund)"/></svg>',
    warn: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.2 11 10.4H1z" fill="none" stroke="var(--refund)" stroke-width="1.3" stroke-linejoin="round"/><path d="M6 4.6v2.8" stroke="var(--refund)" stroke-width="1.3" stroke-linecap="round"/><circle cx="6" cy="8.9" r=".7" fill="var(--refund)"/></svg>',
  }
  function banners() {
    const out = []
    if (permission.includes('NOT')) {
      const key = binds ? KeyLabel.format(binds.toggle) : 'the Panel hotkey'
      out.push(`<div class="banner">${icon.warn}<span>Input Monitoring is off, so ${esc(key)} can't show the panel. Allow POE Tracker there, then reopen the app.</span><button class="ghost" data-fix="permission">Open System Settings</button></div>`)
    }
    const v = data?.view
    if (v?.stopped) {
      const fix = v.stopped_fix === 'resync' ? '<button class="ghost" data-fix="resync">Re-sync character</button>'
        : v.stopped_fix === 'log' ? '<button class="ghost" data-fix="log">Choose Client.txt</button>' : ''
      out.push(`<div class="banner">${icon.pause}<span>${esc(v.stopped)}</span>${fix}</div>`)
    }
    $('banners').innerHTML = out.join('')
  }
  $('banners').onclick = e => {
    const fix = e.target.closest('[data-fix]')?.dataset.fix
    if (fix === 'permission') invoke('open_input_monitoring')
    if (fix === 'resync') invoke('resync_character')
    if (fix === 'log') { show('settings'); $('chooseLog').click() }
  }

  // ---- Tree ----
  const cam = MiniTree.camera(1)
  function drawTree() {
    const stage = $('stage')
    if (!stage || !data || current !== 'tree') return
    const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight)
    stage.querySelector('svg.minitree')?.remove()
    stage.querySelector('.asc')?.remove()
    stage.insertAdjacentHTML('afterbegin', MiniTree.draw(data.view, w, h / w, cam))
    const a = data.view.asc
    if (a) stage.insertAdjacentHTML('beforeend', MiniTree.inset(a, Math.round(Math.min(280, Math.max(160, w * .3))), { names: true, pending: data.view.pending }))
  }

  function renderTree() {
    const el = $('tree')
    if (!data) {
      el.innerHTML = '<p class="empty"><b>No build yet.</b><br>Paste your Path of Building build in the Build section.<br><button data-go="build">Go to Build</button></p>'
      return
    }
    const v = data.view
    const top = `<div class="treebar">
      ${data.character ? `<span class="who">${esc(data.character)}</span>` : ''}
      <select id="treeSpec" aria-label="Tree spec">${data.specs.map((s, i) => `<option value="${i}"${i === data.spec ? ' selected' : ''}>${esc(specLabel(s))}</option>`).join('')}</select>
      <div class="progress"><div class="bar"><i style="width:${v.total ? 100 * v.done / v.total : 0}%"></i></div><span>${v.done} / ${v.total}</span></div></div>`
    if (v.error) {
      el.innerHTML = `${top}<p class="empty"><b>Can't draw ${esc(v.spec)}.</b><br>${esc(v.error)}<br>Pick another tree spec above, or paste the build again in Build.</p>`
    } else if (!v.total) {
      el.innerHTML = `${top}<p class="empty"><b>${esc(v.spec)} has no points to show.</b><br>Pick another tree spec above.</p>`
    } else {
      let n = 0
      const items = data.points.map(p => {
        const kind = p.taken ? 'taken' : (++n <= v.next.length ? 'next' : 'later')
        return `<li class="${kind}" data-id="${p.id}"><b>${p.taken ? Icons.icon('check') : n}</b><span>${esc(p.name)}</span></li>`
      }).join('')
      // the Refunds as drawn on the tree, so clicking one finds it like any point
      const refunded = v.nodes.filter(x => x.s === 'refund').sort((a, b) => a.n.localeCompare(b.n))
      const refunds = refunded.length
        ? `<h2>Refund (${refunded.length})</h2><ol>${refunded.map(r => `<li class="refund" data-id="${r.id}"><b>✕</b><span>${esc(r.n)}</span></li>`).join('')}</ol>`
        : ''
      // the Ascendancy's points, numbered on their own
      const a = v.asc
      let m = 0
      const ascItems = a ? data.asc_points.map(p => `<li class="${p.taken ? 'taken' : 'next'}" data-id="${p.id}"><b>${p.taken ? Icons.icon('check') : ++m}</b><span>${esc(p.name)}</span></li>`).join('') : ''
      const ascList = a ? `<h2>${esc(a.name)} (${a.done} taken, ${a.total - a.done} to go)</h2><ol>${ascItems}</ol>` : ''
      const notices = (v.pending_note ? `<p class="note pending">${MiniTree.swatch('pending')}<span>Pending refund: ${esc(v.pending_note)}</span></p>` : '')
        + v.notices.map(t => `<p class="note">${esc(t)}</p>`).join('')
      // a tick redraws everything: keep the list where the player scrolled it
      const scrolled = el.querySelector('aside')?.scrollTop ?? 0
      el.innerHTML = `${top}<div class="treebody">
        <div id="stage"><span id="hint">scroll to zoom · drag to move · click a point in the list to find it</span></div>
        <aside>${notices}${refunds}<h2>Points (${v.done} taken, ${v.total - v.done} to go)</h2><ol>${items}</ol>${ascList}</aside></div>`
      el.querySelector('aside').scrollTop = scrolled
      drawTree()
      MiniTree.attach($('stage'), cam, drawTree)
      el.querySelector('aside').onclick = e => {
        const li = e.target.closest('li[data-id]')
        const node = li && v.nodes.find(x => x.id === Number(li.dataset.id))
        if (!node) return
        cam.zoom = Math.max(cam.zoom, 3); cam.center = [node.x, node.y]
        drawTree()
      }
      $('stage').addEventListener('mousemove', tip)
      $('stage').addEventListener('mouseleave', () => { $('tip').style.display = 'none' })
    }
    // the everyday switch: a spec picked here is the current one straight away
    $('treeSpec').onchange = () => { cam.zoom = 1; cam.center = null; invoke('set_spec', { spec: Number($('treeSpec').value) }) }
  }
  $('tree').addEventListener('click', e => { const go = e.target.closest('[data-go]'); if (go) show(go.dataset.go) })

  // hover details: name and stats (a mastery's chosen effect)
  function tip(e) {
    const el = cam.drag ? null : e.target.closest('[data-id]')
    const id = el && Number(el.dataset.id)
    const node = el && (data.view.nodes.find(x => x.id === id) || data.view.asc?.nodes.find(x => x.id === id))
    const box = $('tip')
    if (!node) { box.style.display = 'none'; return }
    box.innerHTML = `<strong>${esc(node.n.split(' → ')[0])}</strong>${node.d.map(s => `<div>${esc(s)}</div>`).join('')}`
    box.style.display = 'block'
    const x = Math.min(e.clientX + 14, innerWidth - box.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - box.offsetHeight - 8)
    box.style.left = `${x}px`; box.style.top = `${y}px`
  }
  new ResizeObserver(drawTree).observe(document.body)

  // ---- Gems ----
  let gems = null
  const marks = {
    had: ['check', 'Had'], missing: ['plus', 'Missing'], unlinked: ['unlink', 'Unlinked'],
    remove: ['minus', 'Remove'], optional: ['ring', 'Optional'],
  }
  const mark = st => `<span class="mark ${st}">${Icons.icon(marks[st][0])}${marks[st][1]}</span>`
  const lq = (l, q) => l == null ? '—' : `${l}/${q}`
  // the socketed gem's own picture, else GGG's picture for the gem's name (transfigured gems show their base's)
  const gemKey = n => n.trim().toLowerCase().replace(/ support$/, '')
  function gemIcon(name, own) {
    const art = window.GemIcons?.[gemKey(name)]
    const src = own || (art ? `https://web.poecdn.com/image/${art}.png` : '')
    return src
      ? `<img class="gicon" src="${esc(src)}" alt="" loading="lazy" onerror="this.classList.add('none')">`
      : '<span class="gicon none"></span>'
  }
  function ago(secs) {
    const m = Math.floor((Date.now() / 1000 - secs) / 60)
    return m < 1 ? 'just now' : m === 1 ? '1 min ago' : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ago`
  }
  const copyName = n => `<span class="gcopy" role="button" tabindex="0" data-copy="${esc(n)}" title="Click to copy">${esc(n)}</span>`
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true } catch {}
    // older webviews: copy through a hidden field
    const t = document.createElement('textarea')
    t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'
    document.body.appendChild(t); t.select()
    let ok = false
    try { ok = document.execCommand('copy') } catch {}
    t.remove()
    return ok
  }
  async function copyGem(el) {
    const ok = await copy(el.dataset.copy)
    el.parentElement.querySelector('.copied')?.remove()
    el.insertAdjacentHTML('afterend', `<span class="copied" role="status">${ok ? 'Copied' : "Couldn't copy"}</span>`)
    const badge = el.nextElementSibling
    setTimeout(() => badge?.remove(), 1400)
  }
  $('gems').addEventListener('click', e => { const el = e.target.closest('.gcopy'); if (el) copyGem(el) })
  $('gems').addEventListener('keydown', e => {
    const el = e.target.closest?.('.gcopy')
    if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); copyGem(el) }
  })
  const loadGems = () => invoke('gems_view').then(v => { gems = v; renderGems() })

  function renderGems() {
    const el = $('gems')
    if (current !== 'gems') return
    const v = gems
    if (!v) {
      el.innerHTML = '<p class="empty"><b>No build yet.</b><br>Paste your Path of Building build in the Build section.<br><button data-go="build">Go to Build</button></p>'
      return
    }
    const how = v.chosen === 'paired' ? `goes with ${v.spec}` : v.chosen === 'active' ? `no Skill set pairs with ${v.spec}: the build's own` : 'picked by you'
    const options = v.skill_sets.map((t, i) => `<option value="${i}"${i === v.skill_set ? ' selected' : ''}>${esc(t)}</option>`).join('')
    const follow = v.chosen === 'picked' ? '<button class="ghost" id="followSpec" style="padding:6px 12px;font-size:13px">Follow Tree spec</button>' : ''
    const asof = v.busy ? 'Importing gems…' : v.as_of ? `Gems as of ${ago(v.as_of)}` : ''
    const old = v.as_of && Date.now() / 1000 - v.as_of > 600
    const top = `<div class="treebar gemsbar">
      ${v.character ? `<span class="who">${esc(v.character)}</span>` : ''}
      ${v.skill_sets.length ? `<select id="skillSet" aria-label="Skill set">${options}</select><span class="who how">${esc(how)}</span>` : ''}
      ${follow}<span style="flex:1"></span><span class="asof${old ? ' old' : ''}" title="Gems come from your pathofexile.com profile">${asof}</span></div>`
    const c = v.comparison
    const groups = c ? c.groups : v.groups
    const parts = []
    if (v.notice) parts.push(`<p class="gnote">${esc(v.notice)}</p>`)
    if (c) {
      const n = c.counts
      parts.push(n.missing + n.unlinked + n.remove === 0
        ? `<p class="gnote ok">${mark('had')} All gems match this Skill set.</p>`
        : `<div class="tally">${mark('missing')}<b>${n.missing}</b>${mark('unlinked')}<b>${n.unlinked}</b>${mark('remove')}<b>${n.remove}</b></div>`)
    }
    for (const g of groups) {
      if (g.heading) { parts.push(`<p class="ghead">${esc(g.title)}</p>`); continue }
      const rows = g.gems.map(r => {
        const st = r.status === 'optional' ? 'optional' : r.status
        const name = gemIcon(r.have_name || r.name, r.have_icon) + `<span>${copyName(r.name)}${r.have_name ? ` <small>(${esc(r.have_name)})</small>` : ''}</span>`
        const shown = c ? mark(st) + (st === 'optional' && r.socketed ? ' <small class="hint" style="margin:0">socketed</small>' : '') : (r.status === 'optional' ? mark('optional') : '')
        return `<div class="grow${r.support ? ' support' : ''}${st === 'optional' ? ' optional' : ''}${c && st === 'missing' ? ' missing' : ''}"><span>${shown}</span><span class="gname">${name}</span>
          <span class="lv">${lq(r.want_level, r.want_quality)}</span><span class="lv">${c ? lq(r.have_level, r.have_quality) : ''}</span></div>`
      }).join('')
      parts.push(`<div class="gcard"><h3><span>${esc(g.title)}</span><small>${esc(g.slot)}</small></h3>
        <div class="grow"><span></span><span></span><span class="lv head">Build</span><span class="lv head">${c ? 'Yours' : ''}</span></div>${rows}</div>`)
    }
    if (c && c.remove.length) {
      parts.push(`<div class="gcard remove"><h3><span>Remove</span><small>socketed, not in this Skill set</small></h3>${c.remove.map(x =>
        `<div class="grow"><span>${mark('remove')}</span><span class="gname">${gemIcon(x.name, x.icon)}<span>${copyName(x.name)} <small>· ${esc(x.slot)}</small></span></span><span class="lv"></span><span class="lv">${lq(x.level, x.quality)}</span></div>`).join('')}</div>`)
    }
    const scrolled = el.querySelector('.gemsbody')?.scrollTop ?? 0
    el.innerHTML = `${top}<div class="gemsbody"><div>${parts.join('')}</div></div>`
    el.querySelector('.gemsbody').scrollTop = scrolled
    if ($('skillSet')) $('skillSet').onchange = () => invoke('set_skill_set', { skillSet: Number($('skillSet').value) })
    if ($('followSpec')) $('followSpec').onclick = () => invoke('set_skill_set', { skillSet: null })
  }
  $('gems').addEventListener('click', e => { const go = e.target.closest('[data-go]'); if (go) show(go.dataset.go) })
  listen('gems', loadGems)

  function irow(r) {

  function renderItems() {

  function showChars() {

  const actions = [
    ['toggle', 'Show / hide the Corner panel'], ['gem_toggle', 'Show / hide the Gem panel'], ['guide_toggle', 'Show / hide the Guide panel'],
    ['zoom_in', 'Zoom in'], ['zoom_out', 'Zoom out'], ['zoom_whole', 'Zoom to the whole spec'],
    ['pan_left', 'Move view left'], ['pan_right', 'Move view right'], ['pan_up', 'Move view up'], ['pan_down', 'Move view down'],
  ]
  let recording = null
  function showBinds() {
    $('binds').innerHTML = actions.map(([id, label]) =>
      `<span>${label}</span><button class="ghost${recording === id ? ' rec' : ''}" data-bind="${id}">${recording === id ? 'Press keys…' : esc(KeyLabel.format(binds[id]))}</button>`).join('')
    const bare = actions.filter(([id]) => !['alt', 'ctrl', 'shift', 'meta'].some(m => binds[id][m]))
    $('bindHint').textContent = bare.length
      ? `While Path of Exile is in front these keys go to the app, not the game. ${bare.map(([, l]) => l).join(', ')} has no modifier, so the game loses that key then.`
      : 'While Path of Exile is in front these keys go to the app, not the game. Every other key, Esc included, reaches the game.'
    banners()
  }
  $('binds').onclick = e => {
    const id = e.target.dataset?.bind
    if (!id) return
    recording = recording === id ? null : id
    $('bindErr').textContent = ''
    showBinds()
  }
  window.addEventListener('keydown', async e => {
    if (!recording || current !== 'settings') return
    e.preventDefault(); e.stopPropagation()
    if (/^(Shift|Control|Alt|Meta|OS)/.test(e.code) || !e.code) return
    const next = { ...binds, [recording]: { code: e.code, alt: e.altKey, ctrl: e.ctrlKey, shift: e.shiftKey, meta: e.metaKey } }
    recording = null
    try { binds = await invoke('set_binds', { binds: next }) } catch (err) { $('bindErr').textContent = err }
    showBinds()
  }, true)
  $('resetBinds').onclick = async () => {
    recording = null; $('bindErr').textContent = ''
    try { binds = await invoke('set_binds', { binds: null }) } catch (err) { $('bindErr').textContent = err }
    showBinds()
  }

  // ---- version and updates ----
  let version = ''
  // downloaded at launch while a panel showed: only a restart is left
  let updateKind = null   // 'ready' | 'available'
  function showUpdate(next) {
    if (!next) return
    updateKind = 'ready'
    $('updHead').textContent = 'Update ready'
    $('updText').textContent = `v${version} → v${next}`
    $('update').textContent = 'Restart to update'
    $('update').disabled = false
    $('updBox').hidden = false
  }
  // found while the app runs: downloaded only when the player asks
  function showAvailable(next) {
    if (!next || updateKind === 'ready') return
    updateKind = 'available'
    $('updHead').textContent = 'New version'
    $('updText').textContent = `v${next} is out (you have v${version})`
    $('update').textContent = 'Update now'
    $('update').disabled = false
    $('updErr').textContent = ''
    $('updBox').hidden = false
  }
  $('update').onclick = async () => {
    if (updateKind === 'ready') return invoke('restart_to_update')
    $('update').disabled = true; $('update').textContent = 'Downloading…'; $('updErr').textContent = ''
    try { await invoke('install_update') } catch (e) {
      $('updErr').textContent = String(e)
      $('update').disabled = false; $('update').textContent = 'Try again'
    }
  }
  listen('update_ready', e => showUpdate(e.payload))
  listen('update_available', e => showAvailable(e.payload))
  listen('update_progress', e => {
    const t = String(e.payload)
    if (t.startsWith('The update failed')) { $('updErr').textContent = t; $('update').disabled = false; $('update').textContent = 'Try again' }
    else { $('update').disabled = true; $('update').textContent = t }
  })

  // What's new: the changes since the version last run here, once per update
  async function whatsNew() {
    const entries = await invoke('whats_new')
    if (!entries.length) return
    $('wnTitle').textContent = `What's new in v${entries[0].version}`
    $('wnBody').innerHTML = entries.map(e =>
      `${entries.length > 1 ? `<h3>v${esc(e.version)}</h3>` : ''}<ul>${e.changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`).join('')
    $('whatsNew').showModal()
  }
  $('wnX').onclick = $('wnOk').onclick = () => $('whatsNew').close()
  $('whatsNew').addEventListener('close', () => invoke('whats_new_seen'))

  // ---- load ----
  const loadTree = () => invoke('build_view').then(d => { data = d; renderTree(); banners() })
  // any change to the plan (a tick, a re-sync, a new spec, new settings) reloads what shows it
  listen('plan', () => { loadTree(); loadSetup(false); if (current === 'gems') loadGems(); if (current === 'guide') loadGuide(false) })
  listen('binds', e => { binds = e.payload; showBinds() })
  listen('status', e => { if (e.payload.permission !== permission) { permission = e.payload.permission; banners() } })

  Promise.all([
    invoke('key_binds').then(b => { binds = b; showBinds() }),
    invoke('initial_status').then(s => { permission = s.permission }),
    invoke('app_info').then(i => { version = i.version; $('version').textContent = `v${version}`; showUpdate(i.update); showAvailable(i.available) }),
    loadTree(),
    loadSetup(true),
    invoke('loadouts').then(showLoadouts),
  ]).finally(() => {
    banners()
    if (!current) show(hasBuild ? (recall('section') || 'tree') : 'build')
    if (!hasBuild && loadoutList.length <= 1) openEditor('edit', Math.max(0, activeLoadout()))
    whatsNew()
  })
</script>
</body>
</html>
