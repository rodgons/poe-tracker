[package]
name = "poe-tracker"
version = "0.1.1"
edition = "2021"

[lib]
name = "poe_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# build codes: URL-safe base64 of zlib-compressed XML
base64 = "0.22"
flate2 = "1"
roxmltree = "0.20"
# fetching pobb.in / pastebin links (no CORS from the webview)
ureq = "2"
# Listen-only global key hook. Crates.io release is from 2023; main has the
# macOS off-main-thread fix (set_is_main_thread). See docs/research/tauri-platform.md.
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1", features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.18", features = ["xlib"] }
